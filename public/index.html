<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/bot/icon.svg">
<title>Trading bot dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#14171f;--mut:#6b7280;--line:#e5e7eb;--acc:#2563eb;--up:#15803d;--dn:#b91c1c;--warn:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--fg:#e6e8ee;--mut:#8b93a3;--line:#2a303b;--acc:#6ea0ff;--up:#4ade80;--dn:#f87171;--warn:#fbbf24}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:16px;margin:0}main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.k{color:var(--mut);font-size:12px}.v{font-size:18px;font-weight:600}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--acc)}button.pri{background:var(--acc);border-color:var(--acc);color:#fff}button.danger{color:var(--dn)}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.badge.on{color:var(--up);border-color:var(--up)}.badge.off{color:var(--mut)}.badge.wait{color:var(--warn);border-color:var(--warn)}
table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);max-width:420px;width:92%}
dialog::backdrop{background:#0008}label{display:block;margin:8px 0 3px;color:var(--mut);font-size:12px}
.chips label{display:inline-flex;gap:4px;align-items:center;margin:0 10px 0 0;color:var(--fg);font-size:14px}
svg{width:100%;height:120px;display:block}#login{max-width:380px;margin:12vh auto}
dialog{max-width:520px}
.sel{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 9px;border:1px solid var(--acc);border-radius:99px;font-size:13px}
.chip button{border:0;background:none;padding:0 5px;color:var(--mut);cursor:pointer}
.aplist{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:7px;margin-top:4px}
.aplist div{display:flex;justify-content:space-between;gap:8px;padding:5px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.aplist div:hover,.aplist div.on{background:var(--bg)}.aplist div.picked{color:var(--acc);font-weight:600}
.aplist small{color:var(--mut)}
.badge.live{color:#fff;background:var(--dn);border-color:var(--dn);font-weight:700}.badge.test{color:#000;background:var(--warn);border-color:var(--warn);font-weight:700}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;display:flex;margin:6px 0}.bar i{display:block;height:100%}
.bar .a{background:var(--acc)}.bar .p{background:var(--up)}.bar .over{background:var(--dn)}
.alert{border:1px solid var(--dn);color:var(--dn);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script>
'use strict';
const SN={A:'Donchian',C:'VCEB'};
let symList=null,symErr='';
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=2)=>n==null||!isFinite(n)?'–':Number(n).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d});
const cls=(n)=>n>0?'up':n<0?'dn':'';
const sgn=(n,d=2)=>(n>0?'+':'')+fmt(n,d);
let token=localStorage.getItem('tb_token')||'';
let bots=[],status=null,capital=null,capErr='',prices={},open=new Set(),details={};
const timeAgo=(ms)=>{if(!ms)return 'never';const s=Math.round((Date.now()-ms)/1000);return s<90?s+'s ago':s<5400?Math.round(s/60)+'m ago':Math.round(s/3600)+'h ago'};

async function api(method,path,body){
  const r=await fetch('/api'+path,{method,headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(r.status===401){localStorage.removeItem('tb_token');token='';render();throw new Error('unauthorized')}
  const j=await r.json().catch(()=>null);
  if(!r.ok){
    const issues=Array.isArray(j?.issues)?j.issues.map(x=>x?.path?`${x.path}: ${x.message}`:x?.message).filter(Boolean):[];
    throw new Error(issues.length?`${j?.error||'error'}: ${issues.join('; ')}`:(j?.error||('HTTP '+r.status)));
  }
  return j;
}
// Live prices come straight from Binance (never proxied through the Hono server).
const BASE=()=>status?.binanceBase||'https://api.binance.com';
async function loadPrices(){
  const held=[...new Set(bots.filter(b=>b.position).map(b=>b.position.symbol))];
  if(!held.length)return;
  try{
    const r=await fetch(BASE()+'/api/v3/ticker/price?symbols='+encodeURIComponent(JSON.stringify(held)));
    for(const x of await r.json())prices[x.symbol]=+x.price;
  }catch{}
}
// Asset list for the picker: every USDT pair of the Binance API, most liquid first (fetched by the browser, never via Hono).
async function loadSymbols(){
  if(symList&&Date.now()-symList.at<300000)return symList.rows;
  try{
    const r=await fetch(BASE()+'/api/v3/ticker/24hr?type=MINI');
    if(!r.ok)throw new Error('HTTP '+r.status);
    const rows=(await r.json()).filter(x=>x.symbol.endsWith('USDT')&&+x.quoteVolume>0).map(x=>({s:x.symbol,b:x.symbol.slice(0,-4),p:+x.lastPrice,chg:+x.openPrice?(+x.lastPrice/+x.openPrice-1)*100:0,qv:+x.quoteVolume})).sort((a,b)=>b.qv-a.qv);
    symList={rows,at:Date.now()};symErr='';return rows;
  }catch(e){symErr='Could not load the Binance asset list ('+e.message+'). Type a symbol such as SOLUSDT and press Enter.';return symList?.rows||[]}
}
async function refresh(){
  if(!token)return;
  try{
    [bots,status]=await Promise.all([api('GET','/bots'),api('GET','/status')]);
    await loadPrices();
    try{capital=await api('GET','/capital');capErr=''}catch(e){if(e.message==='unauthorized')throw e;capital=null;capErr=e.message}
    for(const id of open){details[id]=await api('GET','/bots/'+id+'/transactions?limit=500')}
    render();
  }catch(e){if(e.message!=='unauthorized')console.error(e)}
}
const mark=(b)=>{ // equity with unrealized P/L marked at the live Binance price
  const p=b.position;if(!p)return b.cash;
  return b.cash+p.qty*(prices[p.symbol]??b.lastPrice??p.entryFill);
};
function stats(b,txs){
  const sells=txs.filter(t=>t.action==='SELL').reverse();
  const wins=sells.filter(t=>t.pnl>0),loss=sells.filter(t=>t.pnl<=0);
  const gp=wins.reduce((a,t)=>a+t.pnl,0),gl=-loss.reduce((a,t)=>a+t.pnl,0);
  const curve=[b.initialCapital];let peak=b.initialCapital,mdd=0;
  for(const t of txs.slice().reverse()){if(t.action==='CAPITAL'||t.action==='SELL'){curve.push(t.cash_after)}}
  for(const v of curve){peak=Math.max(peak,v);mdd=Math.max(mdd,peak>0?(peak-v)/peak:0)}
  curve.push(mark(b));
  return{n:sells.length,win:sells.length?wins.length/sells.length:null,pf:gl>0?gp/gl:(gp>0?Infinity:null),avgR:sells.length?sells.reduce((a,t)=>a+t.r_multiple,0)/sells.length:null,mdd,curve,fees:txs.reduce((a,t)=>a+(t.fee||0),0)};
}
function spark(vals){
  if(vals.length<2)return '<div class="mut">Not enough data for a curve yet.</div>';
  const w=600,h=120,lo=Math.min(...vals),hi=Math.max(...vals),rg=(hi-lo)||1;
  const pts=vals.map((v,i)=>(i/(vals.length-1)*w).toFixed(1)+','+(h-6-(v-lo)/rg*(h-12)).toFixed(1)).join(' ');
  const up=vals[vals.length-1]>=vals[0];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="${up?'var(--up)':'var(--dn)'}" stroke-width="2" points="${pts}"/></svg>`;
}
function capitalPanel(){
  if(!capital)return `<div class="card"><strong>Capital</strong><div class="alert">Account balance unavailable: ${esc(capErr||'loading…')}. New bots, capital increases and activations are refused until it can be read.</div></div>`;
  const c=capital,tot=Math.max(c.actualCapital,c.allocated,1e-9);
  const pPos=c.inPositions/tot*100,pCash=Math.min(c.botCash/tot*100,100-pPos),pFree=Math.max(0,100-pPos-pCash);
  return `<div class="card"><div class="row" style="justify-content:space-between"><strong>Capital · account vs bot allocations</strong>
    <span class="mut">${esc(c.exchange)} · ${c.cached?'cached':'fresh'} ${timeAgo(c.at)} · <a href="#" data-act="capital-refresh">refresh</a></span></div>
    <div class="grid" style="margin-top:8px">
      <div><div class="k">Actual capital (account)</div><div class="v">${fmt(c.actualCapital)}</div></div>
      <div><div class="k">Allocated to bots</div><div class="v">${fmt(c.allocated)} <span class="mut" style="font-size:12px">${fmt(c.allocatedPct,1)}%</span></div></div>
      <div><div class="k">Unallocated</div><div class="v ${c.unallocated<0?'dn':'up'}">${fmt(c.unallocated)}</div></div>
      <div><div class="k">Bots' idle cash</div><div class="v">${fmt(c.botCash)}</div></div>
      <div><div class="k">In open positions</div><div class="v">${fmt(c.inPositions)}</div></div>
      <div><div class="k">USDT free / locked</div><div class="v" style="font-size:14px">${fmt(c.usdt.free)} / ${fmt(c.usdt.locked)}</div></div>
    </div>
    <div class="bar" title="positions / bot cash / unallocated"><i class="p" style="width:${pPos}%"></i><i class="a" style="width:${pCash}%"></i><i style="width:${pFree}%"></i></div>
    <div class="legend"><span><b style="background:var(--up)"></b>in positions</span><span><b style="background:var(--acc)"></b>bot cash</span><span><b style="background:var(--line)"></b>unallocated</span></div>
    ${c.ok?'<div class="mut" style="margin-top:6px;font-size:12px">✔ Reconciled: the account backs every bot\'s cash and holdings. Bots cannot be created, grown or activated beyond the unallocated amount.</div>':c.drift.map(d=>`<div class="alert">⚠ ${esc(d)}</div>`).join('')+'<div class="mut" style="font-size:12px;margin-top:4px">New entries are blocked until the account matches the books.</div>'}
    ${c.bots.length?`<div class="scroll" style="margin-top:8px"><table><tr><th>Bot</th><th>Status</th><th>Cash</th><th>In position</th><th>Allocated</th><th>Share of account</th></tr>${c.bots.map(b=>`<tr><td>${esc(b.name)} <span class="mut">#${esc(b.id)}</span></td><td>${esc(b.status)}</td><td>${fmt(b.cash)}</td><td>${fmt(b.positionCost)}</td><td>${fmt(b.allocated)}</td><td>${fmt(b.share,1)}%</td></tr>`).join('')}</table></div>`:''}
    ${c.holdings.length?`<div class="k" style="margin-top:8px">Asset holdings vs account: ${c.holdings.map(h=>`<span class="${h.ok?'':'dn'}">${esc(h.asset)} ${h.needed}/${h.free}${h.ok?' ✔':' ✘'}</span>`).join(' · ')}</div>`:''}
  </div>`;
}
const room=()=>capital?` <span class="mut">(unallocated: ${fmt(Math.max(0,capital.unallocated))} USDT)</span>`:'';
function botCard(b){
  const eq=mark(b),pnl=eq-b.initialCapital,pct=pnl/b.initialCapital*100;
  const p=b.position,u=p?(prices[p.symbol]??b.lastPrice??p.entryFill)*p.qty-p.entryFill*p.qty:0;
  const pend=b.pendingActions.map(a=>`<span class="badge wait" title="waits for the trade to exit">${esc(a.type.replace('_',' '))} after exit <a href="#" data-act="cancel" data-id="${b.id}" data-type="${a.type}">✕</a></span>`).join(' ');
  const isOpen=open.has(b.id),txs=details[b.id]||[];
  let more='';
  if(isOpen){
    const s=stats(b,txs);
    more=`<hr style="border:0;border-top:1px solid var(--line);margin:12px 0">
    <div class="grid">
      <div><div class="k">Closed trades</div><div class="v">${s.n}</div></div>
      <div><div class="k">Win rate</div><div class="v">${s.win==null?'–':fmt(s.win*100,1)+'%'}</div></div>
      <div><div class="k">Profit factor</div><div class="v">${s.pf==null?'–':s.pf===Infinity?'∞':fmt(s.pf)}</div></div>
      <div><div class="k">Avg R</div><div class="v">${fmt(s.avgR)}</div></div>
      <div><div class="k">Max drawdown</div><div class="v dn">${fmt(s.mdd*100,1)}%</div></div>
      <div><div class="k">Fees paid</div><div class="v">${fmt(s.fees)}</div></div>
    </div>
    <div class="k" style="margin-top:12px">Equity curve (USDT, per closed trade, last point marked live)</div>${spark(s.curve)}
    <div class="k" style="margin:10px 0 4px">Regime &amp; account protections</div>
    <div class="scroll"><table><tr><th>Regime</th><th>Min score</th><th>Risk x</th><th>Cooldown</th><th>Paused</th><th>Loss streak</th><th>7d R</th><th>Drawdown</th><th>Frozen</th><th>Signals A/C</th><th>Blocked</th></tr>
    <tr><td>${b.account.regime}</td><td>${fmt(b.account.minScore)}</td><td>${fmt(b.account.riskMult)}</td><td>${b.account.cooldownLeft}</td><td>${b.account.paused?'yes':'no'}</td><td>${b.account.consecutiveLosses}</td><td>${fmt(b.account.weekR)}</td><td>${fmt(b.account.drawdownPct*100,1)}%</td><td>${['A','C'].filter(k=>b.account.frozen[k]).map(k=>SN[k]).join(', ')||'–'}</td><td>${b.counters.executedA||0}A/${b.counters.executedC||0}C trades</td><td>${Object.entries(b.counters).filter(([k])=>k.startsWith('blocked_')).reduce((a,[,v])=>a+v,0)}</td></tr></table></div>
    <div class="k" style="margin-top:6px">Data pulled for this bot: ${b.tracking.pulled.length?esc(b.tracking.pulled.slice(0,12).join(', '))+(b.tracking.pulled.length>12?'…':''):'–'}${b.tracking.paused.length?` · paused while in a trade: ${b.tracking.paused.length}`:''}</div>
    <div class="k" style="margin:10px 0 4px">Transaction log</div>
    <div class="scroll"><table><tr><th>Time</th><th>Asset</th><th>Side</th><th>Strat</th><th>Price</th><th>Qty</th><th>P/L USDT</th><th>P/L %</th><th>R</th><th>Exit</th><th>Cash</th></tr>
    ${txs.slice(0,100).map(t=>`<tr><td>${new Date(t.ts).toLocaleString()}</td><td>${esc(t.symbol||'')}</td><td>${t.action}</td><td>${t.strategy?SN[t.strategy]||esc(t.strategy):''}</td><td>${fmt(t.price,4)}</td><td>${fmt(t.qty,6)}</td><td class="${cls(t.pnl)}">${t.pnl==null?'':sgn(t.pnl)}</td><td class="${cls(t.pnl_pct)}">${t.pnl_pct==null?'':sgn(t.pnl_pct)}</td><td>${t.r_multiple==null?'':fmt(t.r_multiple)}</td><td>${esc(t.exit_reason||'')}</td><td>${fmt(t.cash_after)}</td></tr>`).join('')||'<tr><td colspan="11" class="mut">No transactions yet.</td></tr>'}</table></div>`;
  }
  return `<div class="card" data-id="${b.id}">
    <div class="row" style="justify-content:space-between">
      <div class="row"><strong>${esc(b.name)}</strong><span class="mut">#${b.id}</span>
        <span class="badge ${b.status==='active'?'on':'off'}">${b.status}</span><span class="badge">${b.mode}</span>
        ${b.assets.slice(0,8).map(a=>`<span class="badge ${b.tracking.paused.includes(a)?'wait':''}" title="${b.tracking.paused.includes(a)?'not pulled while the bot is in a trade':''}">${a.replace('USDT','')}</span>`).join('')}${b.assets.length>8?`<span class="badge">+${b.assets.length-8}</span>`:''} ${pend}</div>
      <div class="row">
        ${b.status==='active'?`<button data-act="deactivate" data-id="${b.id}">Deactivate…</button>`:`<button class="pri" data-act="activate" data-id="${b.id}">Activate</button>`}
        <button data-act="edit" data-id="${b.id}">Edit</button>
        <button data-act="download" data-id="${b.id}">JSON</button>
        <button data-act="toggle" data-id="${b.id}">${isOpen?'Hide':'Analytics'}</button>
        <button class="danger" data-act="delete" data-id="${b.id}">Delete…</button>
      </div>
    </div>
    <div class="grid" style="margin-top:10px">
      <div><div class="k">Equity</div><div class="v">${fmt(eq)}</div></div>
      <div><div class="k">Total P/L</div><div class="v ${cls(pnl)}">${sgn(pnl)} (${sgn(pct)}%)</div></div>
      <div><div class="k">Cash</div><div class="v">${fmt(b.cash)}</div></div>
      <div><div class="k">Capital base</div><div class="v">${fmt(b.initialCapital)}</div></div>
      <div><div class="k">Position</div><div class="v" style="font-size:14px">${p?`${p.symbol} ${SN[p.strategy]} (${p.strategy}) · ${fmt(p.qty,6)} @ ${fmt(p.entryFill,4)}<br><span class="${cls(u)}">${sgn(u)} unrealized</span> · stop ${fmt(p.stop,4)}`:b.pendingOrder?`${esc(b.pendingOrder.kind)} queued for ${b.pendingOrder.symbol} (${SN[b.pendingOrder.strategy]})`:'<span class="mut">flat</span>'}</div></div>
    </div>${more}</div>`;
}
function render(){
  const el=$('#app');
  if(!token){
    el.innerHTML=`<div id="login" class="card"><h1>Trading bot dashboard</h1><label>Access token</label>
    <input id="tok" type="password" style="width:100%" autofocus><div class="row" style="margin-top:12px"><button class="pri" id="go">Sign in</button><span id="err" class="dn"></span></div></div>`;
    $('#go').onclick=async()=>{token=$('#tok').value.trim();try{await api('GET','/status');localStorage.setItem('tb_token',token);refresh()}catch(e){token='';$('#err').textContent='Invalid token'}};
    $('#tok').onkeydown=(e)=>{if(e.key==='Enter')$('#go').click()};
    return;
  }
  const tot=bots.reduce((a,b)=>a+mark(b),0),cap=bots.reduce((a,b)=>a+b.initialCapital,0);
  el.innerHTML=`<header><h1>Trading bot <span class="badge ${status?.mode==='live'?'live':'test'}" title="${status?.mode==='live'?'real funds via Binance Convert':'Binance spot testnet (no real funds)'}">${status?status.mode.toUpperCase():'…'}</span></h1>
    <div class="row mut"><span>${[...new Set(bots.filter(b=>b.position).map(b=>b.position.symbol))].map(s=>`${s.replace('USDT','')} ${fmt(prices[s],prices[s]>=100?2:prices[s]>=1?4:8)}`).join(' · ')}</span></div>
    <div class="row"><button class="pri" data-act="create">+ New bot</button><button data-act="logout">Sign out</button></div></header>
  <main>
    <div class="card"><div class="row" style="justify-content:space-between"><strong>Profile</strong>
      <span class="mut">token ••••${esc(token.slice(-4))} · ${esc(status?.strategy||'')} · schema v${esc(status?.schemaVersion||'')}</span></div>
      <div class="grid" style="margin-top:8px">
        <div><div class="k">Bots (active)</div><div class="v">${bots.length} (${bots.filter(b=>b.status==='active').length})</div></div>
        <div><div class="k">Total equity</div><div class="v">${fmt(tot)}</div></div>
        <div><div class="k">Total P/L</div><div class="v ${cls(tot-cap)}">${sgn(tot-cap)}</div></div>
        <div><div class="k">Next 4h candle</div><div class="v" style="font-size:14px">${status?new Date(status.nextBarAt).toLocaleTimeString():'–'}</div></div>
        <div><div class="k">Last data cycle</div><div class="v" style="font-size:14px">${timeAgo(status?.workerLastCycle)}</div></div>
        <div><div class="k">Last heartbeat</div><div class="v" style="font-size:14px" title="an outage longer than the interrupt threshold triggers a Telegram alert after reconnect">${timeAgo(status?.heartbeatAt)}</div></div>
        <div><div class="k">Telegram</div><div class="v" style="font-size:14px">${status?.telegram?'on':'off'}</div></div>
        <div><div class="k">Assets pulled / tracked</div><div class="v" style="font-size:14px" title="pulled: ${esc((status?.symbolsPulled||[]).join(', '))}">${status?.symbolsPulled?.length??0} / ${status?.symbolsTracked?.length??0}</div></div>
      </div>${status?.workerError?`<div class="dn" style="margin-top:8px;font-size:12px">Last data error: ${esc(status.workerError)}</div>`:''}
    </div>
    ${capitalPanel()}
    ${bots.map(botCard).join('')||'<div class="card mut">No bots yet. Create one to start trading.</div>'}
  </main>`;
}
const dlg=$('#dlg');
let pick=new Set();
const assetPicker=()=>`<div id="ap"><div class="sel" id="ap-sel"></div><input id="ap-q" placeholder="Search Binance assets (e.g. SOL, PEPE)…" autocomplete="off" style="width:100%"><div class="aplist" id="ap-list"></div><div id="ap-err" class="dn" style="font-size:12px;margin-top:4px"></div></div>`;
const picked=()=>[...pick];
function drawPicker(rows){
  const q=dlg.querySelector('#ap-q').value.trim().toUpperCase().replace(/USDT$/,'');
  dlg.querySelector('#ap-sel').innerHTML=[...pick].map(s=>`<span class="chip">${esc(s.replace(/USDT$/,''))}<button type="button" data-pk="${esc(s)}" title="remove">✕</button></span>`).join('')||'<span class="mut">No asset selected</span>';
  const hit=(q?rows.filter(r=>r.b.includes(q)).sort((a,b)=>(b.b===q)-(a.b===q)||(b.b.startsWith(q)-a.b.startsWith(q))||b.qv-a.qv):rows).slice(0,60);
  dlg.querySelector('#ap-list').innerHTML=hit.map(r=>`<div data-pk="${r.s}" class="${pick.has(r.s)?'picked':''}"><span>${pick.has(r.s)?'✓ ':''}${esc(r.b)}<small>/USDT</small></span><small>${fmt(r.p,r.p>=100?2:r.p>=1?4:8)} · <span class="${cls(r.chg)}">${sgn(r.chg,1)}%</span> · vol ${r.qv>=1e9?fmt(r.qv/1e9,2)+'B':r.qv>=1e6?fmt(r.qv/1e6,1)+'M':fmt(r.qv/1e3,0)+'K'}</small></div>`).join('')||`<div class="mut">${rows.length?'No match':'Asset list unavailable'}${q?' — press Enter to add '+esc(q)+'USDT':''}</div>`;
  dlg.querySelector('#ap-err').textContent=symErr;
}
async function initPicker(sel){
  pick=new Set(sel);
  const rows=await loadSymbols(),q=dlg.querySelector('#ap-q'),toggle=(s)=>{pick.has(s)?pick.delete(s):pick.add(s);drawPicker(rows)};
  drawPicker(rows);q.focus();
  q.oninput=()=>drawPicker(rows);
  q.onkeydown=(e)=>{if(e.key!=='Enter')return;e.preventDefault();const t=q.value.trim().toUpperCase();if(!t)return;const s=t.endsWith('USDT')?t:t+'USDT';pick.add(s);q.value='';drawPicker(rows)};
  dlg.querySelector('#ap').onclick=(e)=>{const t=e.target.closest('[data-pk]');if(!t)return;e.preventDefault();e.stopPropagation();toggle(t.dataset.pk)};
}
function modal(html,onOk,okText='Save',after){
  dlg.innerHTML=`<form method="dialog">${html}<div class="row" style="margin-top:16px;justify-content:flex-end"><button value="x" formnovalidate>Cancel</button><button class="pri" id="ok" value="y">${okText}</button></div><div id="merr" class="dn" style="margin-top:8px"></div></form>`;
  dlg.showModal();if(after)after();
  dlg.querySelector('#ok').onclick=async(e)=>{e.preventDefault();try{await onOk();dlg.close();refresh()}catch(x){dlg.querySelector('#merr').textContent=x.message}};
}
async function download(id){
  const r=await fetch('/api/bots/'+id+'/export',{headers:{authorization:'Bearer '+token}});
  const url=URL.createObjectURL(await r.blob());const a=document.createElement('a');a.href=url;a.download='bot-'+id+'.json';a.click();URL.revokeObjectURL(url);
}
document.addEventListener('click',async(e)=>{
  const t=e.target.closest('[data-act]');if(!t)return;e.preventDefault();
  const {act,id,type}=t.dataset,b=bots.find(x=>x.id===id);
  try{
    if(act==='logout'){localStorage.removeItem('tb_token');token='';render()}
    else if(act==='create')modal(`<h3 style="margin-top:0">New bot</h3><label>Name (optional)</label><input id="n" style="width:100%"><label>Trading assets — any Binance USDT pair (one trade at a time, best signal across them wins)</label>${assetPicker()}<label>Capital (USDT)${room()}</label><input id="c" type="number" min="1" step="0.01" inputmode="decimal" value="1000" style="width:100%">`,
      ()=>api('POST','/bots',{name:dlg.querySelector('#n').value||undefined,assets:picked(),capital:+dlg.querySelector('#c').value}),'Create',()=>initPicker(['BTCUSDT']));
    else if(act==='activate'){await api('POST','/bots/'+id+'/activate');refresh()}
    else if(act==='deactivate')modal(`<h3 style="margin-top:0">Deactivate ${esc(b.name)}</h3><label>When</label><select id="w" style="width:100%"><option value="after_exit">After the current trade exits${b.position?'':' (flat → immediate)'}</option><option value="now">Now (closes any open position at market)</option></select>`,
      ()=>api('POST','/bots/'+id+'/deactivate',{when:dlg.querySelector('#w').value}),'Deactivate');
    else if(act==='edit')modal(`<h3 style="margin-top:0">Edit ${esc(b.name)}</h3><label>Name</label><input id="n" value="${esc(b.name)}" style="width:100%"><label>Trading assets</label>${assetPicker()}<label>If the open trade's asset is removed</label><select id="w" style="width:100%"><option value="after_exit">Wait for the trade to exit</option><option value="now">Close it now</option></select><label>Capital base (USDT) — applied when flat; an increase must fit the unallocated capital${room()}</label><input id="c" type="number" min="1" step="0.01" inputmode="decimal" value="${b.initialCapital}" style="width:100%">`,
      ()=>{const body={name:dlg.querySelector('#n').value,when:dlg.querySelector('#w').value};const a=picked();if(a.join()!==b.assets.join())body.assets=a;const c=+dlg.querySelector('#c').value;if(c!==b.initialCapital)body.capital=c;return api('PATCH','/bots/'+id,body)},'Save',()=>initPicker(b.assets));
    else if(act==='delete')modal(`<h3 style="margin-top:0">Delete ${esc(b.name)}?</h3><p class="mut">All of its data (portfolio, logs, state) is removed permanently.</p><label>When</label><select id="w" style="width:100%"><option value="after_exit">After the current trade exits</option><option value="now">Now</option></select>`,
      ()=>api('DELETE','/bots/'+id+'?when='+dlg.querySelector('#w').value),'Delete');
    else if(act==='capital-refresh'){capital=await api('GET','/capital?fresh=1');render()}
    else if(act==='download')download(id);
    else if(act==='toggle'){open.has(id)?open.delete(id):open.add(id);refresh()}
    else if(act==='cancel'){await api('DELETE','/bots/'+id+'/pending/'+type);refresh()}
  }catch(x){alert(x.message)}
});
render();refresh();setInterval(refresh,15000);
</script>
</body>
</html>
